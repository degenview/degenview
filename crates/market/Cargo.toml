[package]
name = "degenview-market"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Candle data and parsing shared by the DegenView app and its WebAssembly build: pure logic, no I/O"
license = "GPL-3.0-only"
publish = false

# Keep this crate free of anything that does not build for wasm32-unknown-unknown (HTTP clients,
# threads, SQLite, egui): the web build depends on it. CI checks the wasm target.
[dependencies]
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
