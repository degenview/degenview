<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coinbase chart in WebAssembly</title>
  <style>
    :root {
      --bg: #131722;
      --line: #232733;
      --text: #d1d4dc;
      --muted: #8b93a7;
      --up: #26a69a;
      --down: #ef5350;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 14px -apple-system, system-ui, sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px 16px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    select, input {
      padding: 4px 8px;
      color: inherit;
      font: inherit;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    select option { background: var(--bg); }
    #price { font-size: 20px; font-variant-numeric: tabular-nums; }
    #change { font-variant-numeric: tabular-nums; }
    #change.up { color: var(--up); }
    #change.down { color: var(--down); }
    #status { margin-left: auto; color: var(--muted); }
    @media (max-width: 700px) { #hint { display: none; } }
    #status.error { color: var(--down); }
    main { position: relative; flex: 1; min-height: 0; }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }
    canvas.dragging { cursor: grabbing; }
    #hint { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <select id="product" aria-label="Market">
      <option>BTC-USD</option>
      <option>ETH-USD</option>
      <option>SOL-USD</option>
      <option>DOGE-USD</option>
    </select>
    <input id="timeframe" value="4h" list="timeframes" size="5" spellcheck="false"
           autocomplete="off" aria-label="Timeframe (for example 22m, 4h, 2D, 1W)">
    <datalist id="timeframes">
      <option>1m</option><option>5m</option><option>15m</option><option>1h</option>
      <option>4h</option><option>12h</option><option>1D</option><option>1W</option>
      <option>1M</option>
    </datalist>
    <span id="price"></span>
    <span id="change"></span>
    <span id="hint">Drag to pan · wheel to zoom · double-click to reset</span>
    <span id="status">Loading WebAssembly…</span>
  </header>
  <main><canvas id="chart"></canvas></main>

  <script type="module">
    import init, { load_chart } from "./pkg/wasm_chart.js";

    const $ = (id) => document.getElementById(id);
    const canvas = $("chart");
    let chart = null;
    let request = 0;

    function setStatus(text, isError = false) {
      $("status").textContent = text;
      $("status").classList.toggle("error", isError);
    }

    // Paints once per frame however many events arrived.
    let queued = false;
    function redraw() {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        chart?.draw(canvas);
      });
    }

    function showHeader() {
      const price = chart.last_close;
      const change = chart.change_percent;
      $("price").textContent = Number.isNaN(price)
        ? ""
        : price.toLocaleString(undefined, { maximumFractionDigits: 6 });
      $("change").textContent = Number.isNaN(change)
        ? ""
        : `${change >= 0 ? "+" : ""}${change.toFixed(2)}%`;
      $("change").className = change >= 0 ? "up" : "down";
    }

    async function refresh() {
      const mine = ++request;
      setStatus("Loading…");
      try {
        const loaded = await load_chart($("product").value, $("timeframe").value);
        if (mine !== request) return; // a newer selection superseded this one
        chart = loaded;
        showHeader();
        chart.draw(canvas);
        setStatus("Coinbase Exchange · Rust → WebAssembly");
      } catch (error) {
        if (mine === request) setStatus(String(error), true);
      }
    }

    await init();
    $("product").addEventListener("change", refresh);
    $("timeframe").addEventListener("change", refresh);
    new ResizeObserver(redraw).observe(canvas);

    // The chart owns the view; the page only forwards the pointer, in the canvas's CSS pixels.
    canvas.addEventListener("pointerdown", (e) => {
      if (!chart || e.button !== 0) return;
      canvas.setPointerCapture(e.pointerId);
      chart.pointer_down(e.offsetX, e.offsetY);
      canvas.classList.toggle("dragging", chart.dragging);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!chart) return;
      chart.pointer_move(e.offsetX, e.offsetY);
      redraw();
    });
    const release = () => {
      chart?.pointer_up();
      canvas.classList.remove("dragging");
    };
    canvas.addEventListener("pointerup", release);
    canvas.addEventListener("pointercancel", release);
    canvas.addEventListener("pointerleave", () => {
      chart?.pointer_leave();
      redraw();
    });
    canvas.addEventListener("wheel", (e) => {
      if (!chart) return;
      e.preventDefault();
      chart.wheel(e.offsetX, e.deltaY);
      redraw();
    }, { passive: false });
    canvas.addEventListener("dblclick", () => {
      chart?.reset_view();
      redraw();
    });
    refresh();
  </script>
</body>
</html>
