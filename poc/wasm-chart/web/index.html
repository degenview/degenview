<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypto chart in WebAssembly</title>
  <style>
    :root {
      --bg: #131722;
      --line: #232733;
      --text: #d1d4dc;
      --muted: #8b93a7;
      --up: #26a69a;
      --down: #ef5350;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 14px -apple-system, system-ui, sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px 16px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    select, input {
      padding: 4px 8px;
      color: inherit;
      font: inherit;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    select option { background: var(--bg); }
    #price { font-size: 20px; font-variant-numeric: tabular-nums; }
    #change { font-variant-numeric: tabular-nums; }
    #change.up { color: var(--up); }
    #change.down { color: var(--down); }
    #status { margin-left: auto; color: var(--muted); }
    @media (max-width: 700px) { #hint { display: none; } }
    #status.error { color: var(--down); }
    #status.live { color: var(--up); }
    main { position: relative; flex: 1; min-height: 0; }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }
    canvas.dragging { cursor: grabbing; }
    #hint { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <select id="exchange" aria-label="Exchange">
      <option value="coinbase">Coinbase</option>
      <option value="binance">Binance</option>
      <option value="okx">OKX</option>
      <option value="bybit">Bybit</option>
      <option value="kraken">Kraken</option>
      <option value="gate">Gate.io</option>
    </select>
    <select id="asset" aria-label="Asset">
      <option>BTC</option>
      <option>ETH</option>
      <option>SOL</option>
      <option>DOGE</option>
    </select>
    <input id="timeframe" value="4h" list="timeframes" size="5" spellcheck="false"
           autocomplete="off" aria-label="Timeframe (for example 22m, 4h, 2D, 1W)">
    <datalist id="timeframes">
      <option>1m</option><option>5m</option><option>15m</option><option>1h</option>
      <option>4h</option><option>12h</option><option>1D</option><option>1W</option>
      <option>1M</option>
    </datalist>
    <span id="price"></span>
    <span id="change"></span>
    <span id="hint">Drag to pan · wheel to zoom · double-click to reset</span>
    <span id="status">Loading WebAssembly…</span>
  </header>
  <main><canvas id="chart"></canvas></main>

  <script type="module">
    import init, { load_chart, load_snapshot } from "./pkg/wasm_chart.js";

    const $ = (id) => document.getElementById(id);
    const canvas = $("chart");
    let chart = null;
    let request = 0;

    function setStatus(text, state = "") {
      $("status").textContent = text;
      $("status").className = state;
    }

    // Paints once per frame however many events arrived.
    let queued = false;
    function redraw() {
      if (queued) return;
      queued = true;
      requestAnimationFrame(() => {
        queued = false;
        chart?.draw(canvas);
      });
    }

    function showHeader() {
      const price = chart.last_close;
      const change = chart.change_percent;
      $("price").textContent = Number.isNaN(price)
        ? ""
        : price.toLocaleString(undefined, { maximumFractionDigits: 6 });
      $("change").textContent = Number.isNaN(change)
        ? ""
        : `${change >= 0 ? "+" : ""}${change.toFixed(2)}%`;
      $("change").className = change >= 0 ? "up" : "down";
    }

    // What keeps the chart on screen current. Coinbase has a websocket feed whose trades Rust folds
    // into the chart, with a REST snapshot merged over them now and then to catch what the socket
    // missed. The other exchanges are polled: the same snapshot, merged every few seconds.
    const RECONCILE_MS = 30_000;
    const POLL_MS = 10_000;
    let feed = null;

    function stopFeed() {
      if (!feed) return;
      clearInterval(feed.timer);
      clearTimeout(feed.retry);
      if (feed.socket) {
        feed.socket.onclose = null;
        feed.socket.close();
      }
      feed = null;
    }

    function startFeed(current, request) {
      stopFeed();
      const mine = (feed = { timer: null, retry: null, socket: null });
      const reconcile = async () => {
        const started = performance.now();
        try {
          const snapshot = await load_snapshot(request.exchange, request.asset, request.timeframe);
          if (chart !== current) return;
          current.merge(snapshot, started);
          showHeader();
          redraw();
        } catch {
          // The next round tries again; the chart stays as it is meanwhile.
        }
      };
      if (!current.live_feed) {
        setStatus(`${current.exchange_name} · refreshed every ${POLL_MS / 1000} s`, "live");
        mine.timer = setInterval(reconcile, POLL_MS);
        return;
      }
      const connect = (attempt) => {
        const socket = (mine.socket = new WebSocket(current.feed_url));
        socket.onopen = () => {
          socket.send(current.subscribe_message);
          setStatus(`Live · ${current.exchange_name}`, "live");
          if (attempt > 0) reconcile();
        };
        socket.onmessage = (event) => {
          if (chart === current && current.on_message(event.data, performance.now())) {
            showHeader();
            redraw();
          }
        };
        socket.onclose = () => {
          setStatus("Reconnecting…");
          mine.retry = setTimeout(() => connect(attempt + 1), Math.min(1000 * 2 ** attempt, 15_000));
        };
      };
      mine.timer = setInterval(reconcile, RECONCILE_MS);
      connect(0);
    }

    async function refresh() {
      const mine = ++request;
      stopFeed();
      setStatus("Loading…");
      const selected = {
        exchange: $("exchange").value,
        asset: $("asset").value,
        timeframe: $("timeframe").value,
      };
      try {
        const loaded = await load_chart(selected.exchange, selected.asset, selected.timeframe);
        if (mine !== request) return; // a newer selection superseded this one
        chart = loaded;
        showHeader();
        chart.draw(canvas);
        startFeed(loaded, selected);
      } catch (error) {
        if (mine === request) setStatus(String(error), "error");
      }
    }

    await init();
    $("exchange").addEventListener("change", refresh);
    $("asset").addEventListener("change", refresh);
    $("timeframe").addEventListener("change", refresh);
    new ResizeObserver(redraw).observe(canvas);

    // The chart owns the view; the page only forwards the pointer, in the canvas's CSS pixels.
    canvas.addEventListener("pointerdown", (e) => {
      if (!chart || e.button !== 0) return;
      canvas.setPointerCapture(e.pointerId);
      chart.pointer_down(e.offsetX, e.offsetY);
      canvas.classList.toggle("dragging", chart.dragging);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (!chart) return;
      chart.pointer_move(e.offsetX, e.offsetY);
      redraw();
    });
    const release = () => {
      chart?.pointer_up();
      canvas.classList.remove("dragging");
    };
    canvas.addEventListener("pointerup", release);
    canvas.addEventListener("pointercancel", release);
    canvas.addEventListener("pointerleave", () => {
      chart?.pointer_leave();
      redraw();
    });
    canvas.addEventListener("wheel", (e) => {
      if (!chart) return;
      e.preventDefault();
      chart.wheel(e.offsetX, e.deltaY);
      redraw();
    }, { passive: false });
    canvas.addEventListener("dblclick", () => {
      chart?.reset_view();
      redraw();
    });
    refresh();
  </script>
</body>
</html>
