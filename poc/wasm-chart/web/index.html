<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coinbase chart in WebAssembly</title>
  <style>
    :root {
      --bg: #131722;
      --line: #232733;
      --text: #d1d4dc;
      --muted: #8b93a7;
      --up: #26a69a;
      --down: #ef5350;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 14px -apple-system, system-ui, sans-serif;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 12px 16px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    select {
      padding: 4px 8px;
      color: inherit;
      font: inherit;
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    select option { background: var(--bg); }
    #price { font-size: 20px; font-variant-numeric: tabular-nums; }
    #change { font-variant-numeric: tabular-nums; }
    #change.up { color: var(--up); }
    #change.down { color: var(--down); }
    #status { margin-left: auto; color: var(--muted); }
    #status.error { color: var(--down); }
    main { position: relative; flex: 1; min-height: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <header>
    <select id="product" aria-label="Market">
      <option>BTC-USD</option>
      <option>ETH-USD</option>
      <option>SOL-USD</option>
      <option>DOGE-USD</option>
    </select>
    <select id="granularity" aria-label="Timeframe">
      <option value="60">1m</option>
      <option value="300">5m</option>
      <option value="900">15m</option>
      <option value="3600" selected>1h</option>
      <option value="21600">6h</option>
      <option value="86400">1D</option>
    </select>
    <span id="price"></span>
    <span id="change"></span>
    <span id="status">Loading WebAssembly…</span>
  </header>
  <main><canvas id="chart"></canvas></main>

  <script type="module">
    import init, { load_chart } from "./pkg/wasm_chart.js";

    const $ = (id) => document.getElementById(id);
    const canvas = $("chart");
    let chart = null;
    let request = 0;

    function setStatus(text, isError = false) {
      $("status").textContent = text;
      $("status").classList.toggle("error", isError);
    }

    function showHeader() {
      const price = chart.last_close;
      const change = chart.change_percent;
      $("price").textContent = Number.isNaN(price)
        ? ""
        : price.toLocaleString(undefined, { maximumFractionDigits: 6 });
      $("change").textContent = Number.isNaN(change)
        ? ""
        : `${change >= 0 ? "+" : ""}${change.toFixed(2)}%`;
      $("change").className = change >= 0 ? "up" : "down";
    }

    async function refresh() {
      const mine = ++request;
      setStatus("Loading…");
      try {
        const loaded = await load_chart($("product").value, Number($("granularity").value));
        if (mine !== request) return; // a newer selection superseded this one
        chart = loaded;
        showHeader();
        chart.draw(canvas);
        setStatus("Coinbase Exchange · Rust → WebAssembly");
      } catch (error) {
        if (mine === request) setStatus(String(error), true);
      }
    }

    await init();
    $("product").addEventListener("change", refresh);
    $("granularity").addEventListener("change", refresh);
    new ResizeObserver(() => chart?.draw(canvas)).observe(canvas);
    refresh();
  </script>
</body>
</html>
