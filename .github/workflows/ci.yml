name: CI

# Runs the test suite on every pull request, whatever branch it targets (stacked PRs target their
# parent branch, not `main`). Mirrors `cargo test` from AGENTS.md; the release workflow builds, this
# one only checks.
#
# It also runs on every push to `main`: a pull request restores the build cache saved by its base
# branch's runs (GitHub scopes caches by branch; a branch reads its own and `main`'s, never another
# pull request's), so without these runs nothing seeds it and each new pull request compiled the
# whole dependency graph from nothing. Only `main` saves a cache (`save-if` below); pull requests
# only restore it, so they cannot evict it from the repository's cache quota.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in step with release.yml (see there).
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_TERM_COLOR: always

# A new push to a PR supersedes the run still going for its previous commit. A run on `main` is
# never cancelled: it is the one that seeds the cache.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The shipped platform: the only one that compiles and tests the AppKit bridge.
          - name: macos
            os: macos-latest
          # The coordinator/workspace model must keep building without it.
          - name: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libssl-dev pkg-config

      # Tests never touch the Keychain or the network (see AGENTS.md); the flag keeps a stray
      # code path from blocking on a Keychain prompt on the runner.
      - name: Run tests
        env:
          DEGENVIEW_NO_KEYCHAIN: "1"
        run: cargo test --locked

  # The iCloud bridge is Swift and macOS-only; this proves it still compiles and links for the
  # runner's architecture, and that the background alert agent still does not link Swift. A job of
  # its own, beside `test`, so the two builds run side by side instead of one after the other
  # (the feature recompiles the library, so they share nothing but the dependencies).
  icloud:
    name: Build icloud macos
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: icloud-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build with iCloud Sync
        run: |
          cargo build --locked --features icloud
          ! otool -L target/debug/degenview-alert-agent | grep -q libswift
          otool -L target/debug/degenview | grep -q libswiftCloudKit

  # Formatting and Clippy, warnings as errors, on both desktop platforms the full suite runs on:
  # code used only on one of them shows as dead on the other. `icloud` needs the Swift bridge and
  # is left out; the `icloud` job builds it on macOS.
  lint:
    name: Lint ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The one validator of the changes/ fragments, the script the release runs.
      - name: Check changelog fragments
        run: tools/changelog.sh check

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: lint-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libegl1-mesa-dev libssl-dev pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --features alloc-count,dev-unsealed-mcp,dev-mock-broker -- -D warnings

  # The Windows self-updater (`service::update::install::portable_binary`) only runs there, and the full
  # suite has never been run on Windows, so this job runs the update tests and no more. It also
  # proves the whole crate still compiles for Windows, which the release build otherwise finds out.
  # Two runners: x64, and native ARM64, which is where `ring`, the bundled SQLite and the windowing
  # stack first have to build for `aarch64-pc-windows-msvc`.
  test-windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test windows (updater)
            os: windows-latest
            key: windows
          - name: Test windows arm64 (updater)
            os: windows-11-arm
            key: windows-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `cargo test --lib` builds the library only as a test harness, where the updater's per-OS code
      # is compiled differently from the shipped binary; this is the build the release makes.
      - name: Check the crate compiles for Windows
        shell: bash
        run: cargo check --locked

      - name: Run update tests
        shell: bash
        env:
          DEGENVIEW_NO_KEYCHAIN: "1"
        run: cargo test --locked --lib -- update::install update::archive update::check host::update windows_credentials tls_protect

  # Starts the real release executable (GUI subsystem, as shipped) and waits for a frame to be presented. The
  # Windows build was never launched anywhere before this job, so "the app does not open" could not
  # be told from "it opens". The runner has no GPU: wgpu falls back to the WARP software adapter, which
  # proves the startup path and the window loop, not any real driver. "First frame presented" is
  # logged when a screenshot of the first frame comes back, so a hang in rendering is not a pass. `startup.log` (see
  # `crash_report`) is what the job reads, and prints when it fails.
  smoke-windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Launch windows
            os: windows-latest
            key: windows-smoke
          - name: Launch windows arm64
            os: windows-11-arm
            key: windows-arm64-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the release executable
        shell: bash
        run: cargo build --release --locked

      - name: Launch it and wait for a window
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'smoke-data'
          New-Item -ItemType Directory -Force $data | Out-Null
          # A scratch profile: no saved session, no real credentials.
          $env:APPDATA = $data
          $env:LOCALAPPDATA = $data
          $env:DEGENVIEW_NO_KEYCHAIN = '1'
          $log = Join-Path $data 'es.nico.degenview\startup.log'
          $crash = Join-Path $data 'es.nico.degenview\crash.log'
          $process = Start-Process -FilePath (Resolve-Path 'target\release\degenview.exe') -PassThru
          $drawn = $false
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and -not $process.HasExited) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'first frame presented' -Quiet)) {
              $drawn = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          # A window that presents once and then dies is still a failed start.
          if ($drawn) { Start-Sleep -Seconds 15 }
          $process.Refresh()
          $alive = -not $process.HasExited
          foreach ($file in @($log, $crash)) {
            if (Test-Path $file) { Write-Host "::group::$file"; Get-Content $file; Write-Host '::endgroup::' }
          }
          if ($alive) { Stop-Process -Id $process.Id -Force }
          if (-not $drawn) { Write-Host "::error::no frame was presented within 90 s (exited: $($process.HasExited))"; exit 1 }
          if (-not $alive) { Write-Host "::error::the app exited after presenting its first frame (code $($process.ExitCode))"; exit 1 }
