[package]
name = "degenview"
version = "0.5.1"
edition = "2024"
rust-version = "1.95"
description = "A native macOS market dashboard, rewritten in Rust"
license = "GPL-3.0-only"

[features]
# `corpus` pulls in the slow community-Pine corpus test (src/pine/corpus_tests.rs). Off by
# default so `cargo test` stays fast; run the full suite with `cargo test --features corpus`.
default = []
corpus = []
# `icloud` compiles the Swift CloudKit bridge (macOS only; see build.rs) and enables iCloud Sync UI.
# Off by default so developers without the entitlements or a Swift toolchain are unaffected.
icloud = []

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
egui_extras = { version = "0.36.2", features = ["all_loaders"] }
# egui_extras builds `image` without JPEG; CoinGecko serves many coin icons as .jpg. PNG is how
# chart snapshots are saved and uploaded.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Oversize sync payloads (a long paper-trading history) are deflated to fit one CloudKit record.
# Already in the tree through the image crates.
flate2 = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
rusqlite = { version = "0.33", features = ["bundled"] }
tungstenite = { version = "0.27", features = ["rustls-tls-native-roots"] }
ureq = "3.4.2"
rmcp = { version = "3.5.1", features = ["transport-streamable-http-server"] }
tokio = { version = "1.53.2", features = ["rt", "net", "sync", "macros", "time"] }
axum = "0.8.9"
schemars = "1.2.2"
getrandom = "0.4.3"
subtle = "2.6.1"
http = "1.5.0"
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["limit"] }
similar = { version = "3.2.0", default-features = false, features = ["std"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = [
    "NSAccessibilityProtocols",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSGraphics",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", features = [
    "NSArray",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSError",
    "NSNotification",
    "NSObject",
    "NSRunLoop",
    "NSString",
] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
objc2-user-notifications = { version = "0.3.2", features = [
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[profile.release]
lto = "thin"
strip = true
